<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Anime | Shonen</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
</head>

<body>
    <div id="glow"></div>

    <!-- Side Navigation -->
    <nav class="side-nav">
        <div class="nav-logo">
            <i class="fas fa-bolt"></i>
        </div>
        <div class="nav-items">
            <a href="index.html" class="nav-item" title="Home"><i class="fas fa-home"></i></a>
            <a href="index.html#/library" class="nav-item" title="Library"><i class="fas fa-film"></i></a>
            <a href="index.html#/schedule" class="nav-item" title="Schedule"><i class="fas fa-calendar-alt"></i></a>
            <a href="index.html#/favorites" class="nav-item" title="Favorites"><i class="fas fa-heart"></i></a>
        </div>
        <div class="nav-footer">
            <a href="index.html" class="nav-item" title="Search"><i class="fas fa-search"></i></a>
        </div>
    </nav>

    <main id="app">
        <!-- Loader -->
        <div id="loader" class="loader-container">
            <div class="loader" style="display: block;"></div>
        </div>

        <div id="watchView" class="view active">
            <button onclick="window.history.back()" class="glass" style="margin-bottom: 20px; color: white; border: 1px solid var(--border); padding: 10px 20px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: all 0.3s;" onmouseover="this.style.background='var(--primary)'" onmouseout="this.style.background='transparent'">
                <i class="fas fa-arrow-left"></i> Kembali
            </button>

            <div id="detailContainer">
                <!-- Data diinjeksi oleh watch.js -->
            </div>
        </div>
    </main>

    <script src="watch.js"></script>
</body>

</html>
