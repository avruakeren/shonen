<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Anime | Shonen</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <link rel="apple-touch-icon" href="icon.png">
</head>

<body>
    <div id="glow"></div>

    <nav class="side-nav">
        <a href="index.html" class="nav-logo">
            <i class="fas fa-bolt"></i>
        </a>
        <div class="nav-items">
            <a href="index.html" class="nav-item" title="Home" style="animation-delay:0.05s"><i class="fas fa-home"></i></a>
            <a href="index.html#/library" class="nav-item" title="Library" style="animation-delay:0.1s"><i class="fas fa-film"></i></a>
            <a href="index.html#/schedule" class="nav-item" title="Schedule" style="animation-delay:0.15s"><i class="fas fa-calendar-alt"></i></a>
            <a href="index.html#/favorites" class="nav-item" title="Favorites" style="animation-delay:0.2s"><i class="fas fa-heart"></i></a>
        </div>
        <div class="nav-footer">
            <a href="index.html" class="nav-item" title="Search" style="animation-delay:0.25s"><i class="fas fa-search"></i></a>
        </div>
    </nav>

    <main id="app">
        <div id="loader" class="loader-container">
            <div class="loader"></div>
        </div>

        <div id="watchView" class="view active">
            <div class="watch-topbar">
                <button onclick="window.history.back()" class="back-btn">
                    <i class="fas fa-arrow-left"></i> Back
                </button>
                <div id="nowPlayingIndicator" class="now-playing"></div>
            </div>

            <div id="watchContent">
                <section id="playerSection">
                    <div id="playerSkeleton" class="player-skeleton">
                        <div class="player-skel-shimmer"></div>
                    </div>
                    <div id="mainVideoContainer" class="video-container" style="display:none;"></div>
                </section>

                <section id="serverSelector" class="server-selector"></section>

                <section id="animeInfo" class="info-grid">
                    <div id="posterContainer" class="poster-wrapper"></div>
                    <div id="detailMain" class="detail-main"></div>
                </section>

                <section id="episodeSection" class="episode-section">
                    <div class="episode-header">
                        <h3><i class="fas fa-list-ul"></i> Episodes</h3>
                    </div>
                    <div id="episodeGrid" class="episode-select-wrapper"></div>
                </section>

                <section id="downloadSection" class="download-section"></section>

                <section id="recommendedSection" class="recommended-section">
                    <div class="section-header">
                        <h3><i class="fas fa-rays"></i> You May Also Like</h3>
                    </div>
                    <div class="horizontal-scroll" id="recommendedGrid"></div>
                </section>
            </div>
        </div>
    </main>

    <script src="watch.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registered!'))
                    .catch(err => console.log('Service Worker failed:', err));
            });
        }
    </script>
</body>

</html>
