<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Anime | Shonen</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <link rel="apple-touch-icon" href="icon.png">
</head>

<body>
    <nav class="side-nav">
        <a href="index.html" class="nav-logo">
            <i class="fas fa-bolt"></i>
        </a>
        <div class="nav-items">
            <a href="index.html" class="nav-item" title="Home" style="animation-delay:0.05s"><i class="fas fa-home"></i></a>
            <a href="index.html#/library" class="nav-item" title="Library" style="animation-delay:0.1s"><i class="fas fa-film"></i></a>
            <a href="index.html#/schedule" class="nav-item" title="Schedule" style="animation-delay:0.15s"><i class="fas fa-calendar-alt"></i></a>
            <a href="index.html#/favorites" class="nav-item" title="Favorites" style="animation-delay:0.2s"><i class="fas fa-heart"></i></a>
        </div>
        <div class="nav-footer">
            <a href="index.html" class="nav-item" title="Search" style="animation-delay:0.25s"><i class="fas fa-search"></i></a>
        </div>
    </nav>

    <main id="app">
        <div id="loader" class="loader-container">
            <div class="loader"></div>
        </div>

        <div id="watchView" class="view active">
            <div class="watch-topbar">
                <button onclick="window.history.back()" class="back-btn" aria-label="Go back" title="Back">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div id="nowPlayingIndicator" class="now-playing"></div>
                <div class="topbar-actions">
                    <button id="favBtn" class="icon-btn fav-btn" aria-label="Toggle favourite" title="Favourite">
                        <i class="far fa-heart"></i>
                    </button>
                    <button id="infoToggle" class="icon-btn" aria-label="Show anime info" title="Info">
                        <i class="fas fa-circle-info"></i>
                    </button>
                </div>
            </div>

            <div id="watchContent">
                <section id="playerSection">
                    <div id="playerSkeleton" class="player-skeleton">
                        <div class="player-skel-shimmer"></div>
                    </div>
                    <div id="mainVideoContainer" class="video-container" style="display:none;"></div>
                </section>

                <!-- Controls live together directly under the player, so the eye
                     never has to jump player -> info -> episodes. -->
                <div id="controlBar" class="control-bar">
                    <section id="serverSelector" class="server-selector"></section>

                    <section id="episodeSection" class="episode-section">
                        <div class="episode-header">
                            <h3><i class="fas fa-list-ul"></i> Episode</h3>
                        </div>
                        <div id="episodeGrid" class="episode-select-wrapper"></div>
                    </section>

                    <!-- Third control column. Collapsed it is only a header; once
                         opened it takes the whole row so the links have room. -->
                    <section id="downloadSection" class="download-section"></section>
                </div>

                <section id="recommendedSection" class="recommended-section">
                    <div class="section-header">
                        <h3><i class="fas fa-thumbs-up"></i> Recommended</h3>
                    </div>
                    <div class="horizontal-scroll" id="recommendedGrid"></div>
                </section>
            </div>

            <!-- Anime info lives behind the topbar button instead of a permanent
                 block, so the page is just player + controls. The .info-grid /
                 #posterContainer / #detailMain hooks are kept exactly as
                 renderAnimeInfo() writes them. -->
            <div id="infoOverlay" class="info-overlay" style="display:none;">
                <div class="info-modal" role="dialog" aria-modal="true" aria-label="Anime info">
                    <button id="infoModalClose" class="info-modal-close" aria-label="Close info">
                        <i class="fas fa-xmark"></i>
                    </button>
                    <div id="animeInfo" class="info-grid">
                        <div id="posterContainer"></div>
                        <div id="detailMain" class="detail-main"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="watch.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registered!'))
                    .catch(err => console.log('Service Worker failed:', err));
            });
        }
    </script>
</body>

</html>
