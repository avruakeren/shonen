<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shonen | Streaming Anime</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <nav class="glass-nav">
        <div class="logo">
            <i class="fas fa-bolt"></i>
            <span>SHONEN</span>
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search anime...">
            <button id="searchBtn"><i class="fas fa-search"></i></button>
        </div>
    </nav>

    <main id="app">
        <!-- Home View -->
        <div id="homeView">
            <section id="hero">
                <h1>Watch Anime <span class="gradient-text">Ads Free!</span></h1>
            </section>

            <section id="content">
                <div class="section-header">
                    <h2 id="sectionTitle">Latest Releases</h2>
                    <div class="loader" id="loader"></div>
                </div>
                <div class="anime-grid" id="animeGrid">
                    <!-- Anime cards will be injected here -->
                </div>
            </section>
        </div>

        <!-- Detail View -->
        <div id="detailView" style="display: none; padding-top: 20px;">
            <button id="backBtn" class="back-btn"
                style="background: var(--glass); color: white; border: 1px solid var(--glass-border); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; transition: all 0.3s ease;">
                <i class="fas fa-arrow-left"></i> Back to Home
            </button>
            <div id="detailContainer" class="glass"
                style="padding: 30px; border-radius: 24px; border: 1px solid var(--glass-border);">
                <!-- Details will be injected here -->
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
