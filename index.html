<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shonen | Streaming Anime</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="shortcut icon" href="icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Shonen">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Shonen">
    <meta name="format-detection" content="telephone=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
</head>


<body>
    <div id="glow"></div>

    <!-- Side Navigation -->
    <nav class="side-nav">
        <div class="nav-logo">
            <i class="fas fa-bolt"></i>
        </div>
        <div class="nav-items">
            <a href="#/" class="nav-item active" title="Home"><i class="fas fa-home"></i></a>
            <a href="#/library" class="nav-item" title="Library"><i class="fas fa-film"></i></a>
            <a href="#/schedule" class="nav-item" title="Schedule"><i class="fas fa-calendar-alt"></i></a>
            <a href="#/favorites" class="nav-item" title="Favorites"><i class="fas fa-heart"></i></a>
        </div>
        <div class="nav-footer">
            <button id="searchToggle" title="Search"><i class="fas fa-search"></i></button>
        </div>
    </nav>

    <!-- Top Bar (Mobile/Search) -->
    <div class="top-bar">
        <div class="search-overlay" id="searchOverlay" style="display: none;">
            <div class="search-bar">
                <button id="executeSearch"><i class="fas fa-search"></i></button>
                <input type="text" id="searchInput" placeholder="Search anime..." autocomplete="off">
                <button id="closeSearch"><i class="fas fa-times"></i></button>
            </div>
        </div>
        <div class="mobile-header">
            <div class="logo"><i class="fas fa-bolt"></i>SHONEN</div>
            <button id="mobileSearchBtn"><i class="fas fa-search"></i></button>
        </div>
    </div>

    <main id="app">
        <!-- Loader -->
        <div id="loader" class="loader-container">
            <div class="loader"></div>
        </div>

        <!-- Home View -->
        <div id="homeView" class="view active">
            <section id="hero">
                <h1>Watch Anime <span class="gradient-text">Ads Free!</span></h1>
            </section>

            <section id="ongoingSection">
                <div class="section-header">
                    <h2><i class="fas fa-fire" style="color: #f97316;"></i> Latest Updates</h2>
                </div>
                <div class="anime-grid" id="ongoingGrid">
                    <!-- Cards injected here -->
                </div>

            </section>

            <section id="mal-sections" style="margin-top: 4rem;">
                <!-- Seasonal -->
                <div class="section-header">
                    <h2 id="seasonalTitle"><i class="fas fa-leaf" style="color: #10b981;"></i> Seasonal Anime</h2>
                </div>
                <div class="horizontal-scroll" id="seasonalGrid"></div>

                <!-- Top Anime -->
                <div class="section-header" style="margin-top: 3rem;">
                    <h2><i class="fas fa-trophy" style="color: #fbbf24;"></i> Top Rated</h2>
                </div>
                <div class="horizontal-scroll" id="topGrid"></div>
            </section>
        </div>

        <!-- Library View (Movies/Complete) -->
        <div id="libraryView" class="view">
            <section id="hero">
                <h1>Explore <span class="gradient-text">Library</span></h1>
            </section>
            <div class="anime-grid" id="libraryGrid"></div>
            <div style="text-align: center; margin-top: 40px; margin-bottom: 40px;">
                <button id="loadMoreLibrary" class="glass"
                    style="padding: 12px 40px; border-radius: 99px; color: white; cursor: pointer; border: 1px solid var(--glass-border); font-weight: 600; font-size: 1rem;">
                    <i class="fas fa-plus-circle"></i> Load More Anime
                </button>
            </div>
        </div>

        <!-- Favorites View -->
        <div id="favoritesView" class="view">
            <div class="section-header">
                <h2><i class="fas fa-heart" style="color: #f43f5e;"></i> My Favorites</h2>
            </div>
            <div class="anime-grid" id="favoritesGrid"></div>
        </div>

        <!-- Schedule View -->
        <div id="scheduleView" class="view">
            <div class="section-header">
                <h2><i class="fas fa-calendar-day" style="color: var(--primary);"></i> Weekly Schedule</h2>
            </div>
            <div class="schedule-container" id="scheduleContainer"></div>
        </div>

        <!-- Search View -->
        <div id="searchView" class="view">
            <div class="section-header">
                <h2>Search Results for: <span id="searchQueryText" class="gradient-text">...</span></h2>
            </div>
            <div class="anime-grid" id="searchGrid"></div>
        </div>

    </main>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered!'))
                    .catch(err => console.log('Service Worker failed:', err));
            });
        }
    </script>
</body>

</html>
