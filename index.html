<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shonen | Streaming Anime</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3252/3252906.png">
</head>

<body>
    <div id="glow"></div>

    <nav class="glass-nav">
        <div class="logo">
            <i class="fas fa-bolt"></i>
            <span>SHONEN</span>
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search anime...">
            <button id="searchBtn"><i class="fas fa-search"></i></button>
            <button id="scheduleBtn" class="glass" style="margin-left: 10px; border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; border: 1px solid var(--glass-border);"><i class="fas fa-calendar-alt"></i></button>
        </div>
    </nav>

    <main id="app">
        <!-- Home View -->
        <div id="homeView">
            <section id="hero">
                <h1>Watch Anime <span class="gradient-text">Ads Free!</span></h1>
            </section>

            <section id="scheduleSection" style="display: none; margin-bottom: 3rem;">
                <div class="section-header" style="margin-bottom: 1.5rem;">
                    <h2><i class="fas fa-calendar-day" style="color: var(--primary); margin-right: 8px;"></i> Weekly Schedule</h2>
                </div>
                <div class="schedule-container" id="scheduleContainer" style="display: flex; flex-direction: column; gap: 20px;">
                    <!-- Schedule data will be injected here -->
                </div>
            </section>

            <section id="mal-sections" style="margin-bottom: 3rem;">
                <!-- My Favorites -->
                <div id="favoritesSection" style="display: none; margin-bottom: 3rem;">
                    <div class="section-header" style="margin-bottom: 1rem;">
                        <h2><i class="fas fa-heart" style="color: #f43f5e; margin-right: 8px;"></i> My Favorites</h2>
                    </div>
                    <div class="horizontal-scroll" id="favoritesGrid">
                        <!-- Favorites injected here -->
                    </div>
                </div>

                <!-- Seasonal -->
                <div class="section-header" style="margin-bottom: 1rem;">
                    <h2 id="seasonalTitle"><i class="fas fa-leaf" style="color: #10b981; margin-right: 8px;"></i>
                        Seasonal Anime</h2>
                </div>
                <div class="horizontal-scroll" id="seasonalGrid">
                    <!-- Cards injected here -->
                </div>

                <!-- Top Anime -->
                <div class="section-header" style="margin-top: 2rem; margin-bottom: 1rem;">
                    <h2><i class="fas fa-trophy" style="color: #fbbf24; margin-right: 8px;"></i> Top Anime</h2>
                </div>
                <div class="horizontal-scroll" id="topGrid">
                    <!-- Cards injected here -->
                </div>
            </section>

            <section id="content">
                <div class="section-header">
                    <h2 id="sectionTitle">Latest Releases</h2>
                    <div class="loader" id="loader"></div>
                </div>
                <div class="anime-grid" id="animeGrid">
                    <!-- Anime cards will be injected here -->
                </div>
            </section>
        </div>

        <!-- Detail View -->
        <div id="detailView" style="display: none; padding-top: 20px;">
            <button id="backBtn" class="back-btn"
                style="background: var(--glass); color: white; border: 1px solid var(--glass-border); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; transition: all 0.3s ease;">
                <i class="fas fa-arrow-left"></i> Back to Home
            </button>
            <div id="detailContainer" class="glass"
                style="padding: 30px; border-radius: 24px; border: 1px solid var(--glass-border);">
                <!-- Details will be injected here -->
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registered!'))
                    .catch(err => console.log('Service Worker failed:', err));
            });
        }
    </script>
</body>

</html>
